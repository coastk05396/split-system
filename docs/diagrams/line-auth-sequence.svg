<text x="50" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Token issued</text>
<line x1="190" y1="16" x2="220" y2="16" stroke="#06c755" stroke-width="1.2" marker-end="url(#line-auth-sequence-arrow-link)"/>
<text x="230" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">LINE protocol</text>
<line x1="370" y1="16" x2="400" y2="16" stroke="#26684b" stroke-width="1.2" marker-end="url(#line-auth-sequence-arrow)"/>
<text x="410" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Call</text>
<line x1="480" y1="16" x2="510" y2="16" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#line-auth-sequence-arrow)"/>
<text x="520" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Return</text>
</g>

      </svg>
