<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1060 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="split-seq-title split-seq-desc" id="line-auth-sequence-root">
        <title id="split-seq-title">LINE 登入流程時序圖</title>
        <desc id="split-seq-desc">SPA 取得 LIFF ID token 後呼叫 /auth/line；Worker 用 KV 快取的 LINE 公鑰驗證簽章（快取失效才重新下載），在 D1 建立或沿用 User 與 Identity、新增 Session，回傳 access token 與 refresh cookie。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #line-auth-sequence-root { --color-paper:   #f6fff8;
      --color-paper-2: #e8f5eb;
      --color-ink:     #163d2a;
      --color-muted:   #26684b;
      --color-accent:  #1b7a43;
      --color-link:    #06c755;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #line-auth-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #line-auth-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#line-auth-sequence-root .diagram-container { overflow-x: visible; }
}</style><pattern id="line-auth-sequence-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#163d2a" fill-opacity="0.08"/></pattern>
<marker id="line-auth-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#26684b"/></marker>
<marker id="line-auth-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#1b7a43"/></marker>
<marker id="line-auth-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#06c755"/></marker>
<marker id="line-auth-sequence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#26684b" stroke-width="1.2"/></marker></defs>

        <rect width="100%" height="100%" fill="#f6fff8"/>
        <rect width="100%" height="100%" fill="url(#line-auth-sequence-dots)" opacity="0.6"/>
<!-- Lifelines -->
<line x1="110" y1="90" x2="110" y2="600" stroke="#163d2a" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.22"/>
<line x1="330" y1="90" x2="330" y2="600" stroke="#163d2a" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.22"/>
