<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="split-arch-title split-arch-desc" id="architecture-root">
        <title id="split-arch-title">前後端系統架構圖</title>
        <desc id="split-arch-desc">展示 Split 前端 SPA 客戶端、LINE LIFF、Cloudflare Workers 邊緣運算層、D1 關聯式資料庫及外部 OAuth 身分驗證的整合架構。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f6fff8;
      --color-paper-2: #e8f5eb;
      --color-ink:     #163d2a;
      --color-muted:   #26684b;
      --color-accent:  #1b7a43;
      --color-link:    #06c755;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="architecture-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#163d2a" fill-opacity="0.08"/>
          </pattern>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#26684b"/>
          </marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#1b7a43"/>
          </marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#06c755"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f6fff8"/>
        <rect width="100%" height="100%" fill="url(#architecture-dots)" opacity="0.6"/>

        <!-- =================================================================
             TIER ZONES (drawn before arrows and nodes)
             ================================================================= -->
        <!-- Zone 1: Client Layer -->
        <rect x="40" y="48" width="220" height="424" rx="8" fill="#163d2a" stroke="#163d2a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="56" y="52" width="88" height="14" rx="2" fill="#f6fff8"/>
        <text x="100" y="63" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">CLIENT TIER</text>

        <!-- Zone 2: Edge Cloudflare Layer -->
        <rect x="300" y="48" width="370" height="424" rx="8" fill="#163d2a" stroke="#163d2a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="316" y="52" width="132" height="14" rx="2" fill="#f6fff8"/>
        <text x="382" y="63" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">CLOUDFLARE EDGE</text>

        <!-- Zone 3: Data & External Layer -->
        <rect x="710" y="48" width="250" height="424" rx="8" fill="#163d2a" stroke="#163d2a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="726" y="52" width="128" height="14" rx="2" fill="#f6fff8"/>
        <text x="790" y="63" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">STORAGE &amp; IDP</text>

        <!-- =================================================================
             ARROWS (drawn before boxes so lines stay behind nodes)
             ================================================================= -->
        <!-- Web App -> Static Assets: L-path top/right -->
        <path d="M 220,130 H 324" fill="none" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <rect x="238" y="122" width="70" height="14" rx="2" fill="#f6fff8"/>
        <text x="273" y="132" fill="#26684b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LOAD SPA</text>

        <!-- Web App -> Worker API (Primary REST flow) -->
        <path d="M 220,180 H 312 Q 320,180 320,192 V 270 Q 320,280 328,280 H 332" fill="none" stroke="#1b7a43" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <rect x="232" y="222" width="76" height="14" rx="2" fill="#f6fff8"/>
        <text x="270" y="232" fill="#1b7a43" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">/api/v1 (JSON)</text>

        <!-- LINE LIFF Client -> LINE Auth Provider -->
        <path d="M 220,380 H 260 Q 268,380 268,390 V 440 Q 268,448 276,448 H 720" fill="none" stroke="#06c755" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
        <rect x="440" y="440" width="104" height="14" rx="2" fill="#f6fff8"/>
        <text x="492" y="450" fill="#06c755" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">LINE SDK AUTH</text>

        <!-- Worker API -> D1 DB: Solid line (Primary Database queries) -->
        <line x1="512" y1="280" x2="728" y2="280" stroke="#1b7a43" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <rect x="584" y="272" width="76" height="14" rx="2" fill="#f6fff8"/>
        <text x="622" y="282" fill="#1b7a43" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">SQL / DRIZZLE</text>

        <!-- Worker API -> KV Cache: Top orthogonal elbow -->
        <path d="M 424,240 V 160 Q 424,152 432,152 H 472" fill="none" stroke="#26684b" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="400" y="184" width="48" height="14" rx="2" fill="#f6fff8"/>
        <text x="424" y="194" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">JWKS</text>

        <!-- Worker API -> External OAuth IDPs: Lower elbow -->
        <path d="M 460,320 V 390 Q 460,400 468,400 H 720" fill="none" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <rect x="570" y="392" width="88" height="14" rx="2" fill="#f6fff8"/>
        <text x="614" y="402" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FETCH CERTS</text>

        <!-- =================================================================
             NODE BOXES
             ================================================================= -->
        <!-- Node 1: React SPA (Client) -->
        <g id="node-spa">
          <rect x="60" y="90" width="160" height="90" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1.2"/>
          <rect x="70" y="100" width="46" height="14" rx="2" fill="#e8f5eb"/>
          <text x="93" y="110" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">SPA APP</text>
          <text x="70" y="136" fill="#163d2a" font-size="13" font-family="'Geist', 'Noto Sans TC', sans-serif" font-weight="600">React 19 Frontend</text>
          <text x="70" y="156" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace">Tailwind · Vite · Hono</text>
        </g>

        <!-- Node 2: LINE LIFF Context (Client) -->
        <g id="node-liff">
          <rect x="60" y="320" width="160" height="90" rx="6" fill="#f6fff8" stroke="#06c755" stroke-width="1.2"/>
          <rect x="70" y="330" width="40" height="14" rx="2" fill="#e8f5eb"/>
          <text x="90" y="340" fill="#06c755" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">MOBILE</text>
          <text x="70" y="366" fill="#163d2a" font-size="13" font-family="'Geist', 'Noto Sans TC', sans-serif" font-weight="600">LINE LIFF Client</text>
          <text x="70" y="386" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace">In-App Browser · SDK</text>
        </g>

        <!-- Node 3: Workers Static Assets (Edge) -->
        <g id="node-assets">
          <rect x="330" y="90" width="170" height="80" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1"/>
          <rect x="340" y="100" width="48" height="14" rx="2" fill="#e8f5eb"/>
          <text x="364" y="110" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">ASSETS</text>
          <text x="340" y="134" fill="#163d2a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Worker Assets</text>
          <text x="340" y="152" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace">CDN edge cache · HTML</text>
        </g>

        <!-- Node 4: Cloudflare KV (Edge) -->
        <g id="node-kv">
          <rect x="480" y="110" width="170" height="80" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1"/>
          <rect x="490" y="120" width="36" height="14" rx="2" fill="#e8f5eb"/>
          <text x="508" y="130" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">CACHE</text>
          <text x="490" y="154" fill="#163d2a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">JWKS_CACHE</text>
          <text x="490" y="172" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace">KV · Fast key lookup</text>
        </g>

        <!-- Node 5: Cloudflare Worker API (FOCAL NODE) -->
        <g id="node-worker">
          <rect x="332" y="240" width="180" height="80" rx="6" fill="#1b7a43" stroke="#1b7a43" stroke-width="1.8" fill-opacity="0.06"/>
          <rect x="342" y="250" width="40" height="14" rx="2" fill="#1b7a43"/>
          <text x="362" y="260" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">FOCAL</text>
          <text x="342" y="284" fill="#163d2a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">split-prod Worker</text>
          <text x="342" y="302" fill="#1b7a43" font-size="9" font-family="'Geist Mono', monospace">Hono REST · Auth · Drizzle</text>
        </g>

        <!-- Node 6: Cloudflare D1 Database (Storage) -->
        <g id="node-d1">
          <rect x="734" y="240" width="200" height="80" rx="6" fill="#f6fff8" stroke="#1b7a43" stroke-width="1.4"/>
          <rect x="744" y="250" width="46" height="14" rx="2" fill="#e8f5eb"/>
          <text x="767" y="260" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">D1 SQL</text>
          <text x="744" y="284" fill="#163d2a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">Cloudflare D1 DB</text>
          <text x="744" y="302" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace">SQLite · Transactions · WAL</text>
        </g>

        <!-- Node 7: Identity Providers (LINE & Google) -->
        <g id="node-idp">
          <rect x="734" y="360" width="200" height="80" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1"/>
          <rect x="744" y="370" width="42" height="14" rx="2" fill="#e8f5eb"/>
          <text x="765" y="380" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle">OAUTH</text>
          <text x="744" y="404" fill="#163d2a" font-size="13" font-family="'Geist', sans-serif" font-weight="600">LINE / Google IdPs</text>
          <text x="744" y="422" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace">OpenID Connect Discovery</text>
        </g>

        <!-- Bottom Legend Strip -->
        <g id="legend" transform="translate(40, 490)">
          <line x1="0" y1="0" x2="920" y2="0" stroke="#163d2a" stroke-width="0.8" stroke-opacity="0.12"/>
          <rect x="10" y="10" width="12" height="12" rx="2" fill="#1b7a43"/>
          <text x="28" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Core API Hub</text>
          <line x1="160" y1="16" x2="190" y2="16" stroke="#1b7a43" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
          <text x="200" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Primary Flow</text>
          <line x1="330" y1="16" x2="360" y2="16" stroke="#06c755" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
          <text x="370" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">LINE External Auth</text>
          <line x1="530" y1="16" x2="560" y2="16" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
          <text x="570" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Async / Cache / Query</text>
        </g>
      </svg>
