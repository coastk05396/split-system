        <title id="split-arch-title">前後端系統架構圖</title>
        <desc id="split-arch-desc">Split 的 React SPA、LINE 平台、Cloudflare Worker、GroupLedger Durable Object（群組帳務權威）、D1 與外部 API 之間的呼叫關係。</desc>
