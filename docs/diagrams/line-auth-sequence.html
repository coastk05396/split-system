<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 登入流程時序圖 (LINE Auth Sequence)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6fff8;
      --color-paper-2: #e8f5eb;
      --color-ink:     #163d2a;
      --color-muted:   #26684b;
      --color-accent:  #1b7a43;
      --color-link:    #06c755;
      --font-sans:     'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1060px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Authentication</p>
    <h1>LINE 登入流程時序圖 (LINE Auth Sequence)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1060 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="split-seq-title split-seq-desc">
        <title id="split-seq-title">LINE 登入流程時序圖</title>
        <desc id="split-seq-desc">SPA 取得 LIFF ID token 後呼叫 /auth/line；Worker 用 KV 快取的 LINE 公鑰驗證簽章（快取失效才重新下載），在 D1 建立或沿用 User 與 Identity、新增 Session，回傳 access token 與 refresh cookie。</desc>
        <defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(22,61,42,0.08)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#26684b"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#1b7a43"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#06c755"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#26684b" stroke-width="1.2"/></marker></defs>

        <rect width="100%" height="100%" fill="#f6fff8"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>
<!-- Lifelines -->
<line x1="110" y1="90" x2="110" y2="600" stroke="rgba(22,61,42,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="330" y1="90" x2="330" y2="600" stroke="rgba(22,61,42,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="550" y1="90" x2="550" y2="600" stroke="rgba(22,61,42,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="770" y1="90" x2="770" y2="600" stroke="rgba(22,61,42,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="950" y1="90" x2="950" y2="600" stroke="rgba(22,61,42,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="306" y="280" width="488" height="140" rx="4" fill="rgba(22,61,42,0.02)" stroke="rgba(22,61,42,0.20)" stroke-width="1"/>
<rect x="306" y="280" width="40" height="16" rx="2" fill="#f6fff8" stroke="rgba(22,61,42,0.20)" stroke-width="1"/>
<text x="326" y="292" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">OPT</text>
<text x="350" y="312" fill="#26684b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[cache miss or unknown key id]</text>
<rect x="106" y="118" width="8" height="32" rx="2" fill="#e8f5eb" stroke="#26684b" stroke-width="0.8"/>
<rect x="106" y="190" width="8" height="384" rx="2" fill="#e8f5eb" stroke="#26684b" stroke-width="0.8"/>
<rect x="326" y="190" width="8" height="384" rx="2" fill="#e8f5eb" stroke="#26684b" stroke-width="0.8"/>
<rect x="546" y="226" width="8" height="30" rx="2" fill="#e8f5eb" stroke="#26684b" stroke-width="0.8"/>
<rect x="546" y="388" width="8" height="20" rx="2" fill="#e8f5eb" stroke="#26684b" stroke-width="0.8"/>

<rect x="946" y="500" width="8" height="30" rx="2" fill="#e8f5eb" stroke="#26684b" stroke-width="0.8"/>
<!-- Messages -->
<path d="M 114,120 H 154 Q 162,120 162,128 V 140 Q 162,148 154,148 H 114" fill="none" stroke="#06c755" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<text x="170" y="137" fill="#06c755" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="start" letter-spacing="0.04em">liff.getIDToken()</text>
<line x1="114" y1="190" x2="326" y2="190" stroke="#26684b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="143" y="170" width="154" height="14" rx="2" fill="#f6fff8"/>
<text x="220" y="180" fill="#163d2a" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">POST /auth/line { idToken }</text>
<line x1="334" y1="226" x2="546" y2="226" stroke="#26684b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="401" y="206" width="78" height="14" rx="2" fill="#f6fff8"/>
<text x="440" y="216" fill="#163d2a" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">GET jwks:line</text>
<line x1="546" y1="256" x2="334" y2="256" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="405" y="236" width="70" height="14" rx="2" fill="#f6fff8"/>
<text x="440" y="246" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">keys, or null</text>
<line x1="334" y1="342" x2="766" y2="342" stroke="#06c755" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<rect x="379" y="322" width="127" height="14" rx="2" fill="#f6fff8"/>
<text x="442" y="332" fill="#06c755" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">GET /oauth2/v2.1/certs</text>
<line x1="766" y1="370" x2="334" y2="370" stroke="#06c755" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
<rect x="615" y="350" width="90" height="14" rx="2" fill="#f6fff8"/>
<text x="660" y="360" fill="#06c755" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">JWKS (ES256 keys)</text>
<line x1="334" y1="398" x2="546" y2="398" stroke="#26684b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="376" y="378" width="132" height="14" rx="2" fill="#f6fff8"/>
<text x="442" y="388" fill="#163d2a" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">PUT jwks:line · TTL 1 h</text>
<path d="M 334,440 H 374 Q 382,440 382,448 V 460 Q 382,468 374,468 H 334" fill="none" stroke="#26684b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="390" y="457" fill="#26684b" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="start" letter-spacing="0.04em">verify ES256 · aud · exp</text>
<line x1="334" y1="504" x2="946" y2="504" stroke="#26684b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="578" y="484" width="165" height="14" rx="2" fill="#f6fff8"/>
<text x="660" y="494" fill="#163d2a" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">users · identities · sessions</text>
<line x1="946" y1="534" x2="334" y2="534" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="630" y="514" width="61" height="14" rx="2" fill="#f6fff8"/>
<text x="660" y="524" fill="#245b41" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ok · userId</text>
<line x1="326" y1="570" x2="114" y2="570" stroke="#1b7a43" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
<rect x="151" y="550" width="138" height="14" rx="2" fill="#1b7a43"/>
<text x="220" y="560" fill="#ffffff" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" text-anchor="middle" letter-spacing="0.04em">200 accessToken + cookie</text>
<!-- Actors -->
<g><rect x="30" y="40" width="160" height="50" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1.2"/>
<text x="110" y="62" fill="#163d2a" font-size="12" font-family="'Geist', 'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle">React SPA</text>
<text x="110" y="78" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@line/liff · browser</text></g>
<g><rect x="250" y="40" width="160" height="50" rx="6" fill="rgba(27,122,67,0.06)" stroke="#1b7a43" stroke-width="1.6"/>
<text x="330" y="62" fill="#163d2a" font-size="12" font-family="'Geist', 'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle">split Worker</text>
<text x="330" y="78" fill="#1b7a43" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hono · /api/v1/auth</text></g>
<g><rect x="470" y="40" width="160" height="50" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1.2"/>
<text x="550" y="62" fill="#163d2a" font-size="12" font-family="'Geist', 'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle">JWKS_CACHE</text>
<text x="550" y="78" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Workers KV</text></g>
<g><rect x="690" y="40" width="160" height="50" rx="6" fill="#f6fff8" stroke="#06c755" stroke-width="1.6"/>
<text x="770" y="62" fill="#163d2a" font-size="12" font-family="'Geist', 'Noto Sans TC', sans-serif" font-weight="600" text-anchor="middle">LINE Platform</text>
<text x="770" y="78" fill="#06c755" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.line.me</text></g>
<g><rect x="870" y="40" width="160" height="50" rx="6" fill="#f6fff8" stroke="#26684b" stroke-width="1.2"/>

<text x="950" y="78" fill="#4f6b5b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">users · sessions</text></g>
<g id="legend" transform="translate(30, 624)">
<line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(22,61,42,0.12)" stroke-width="0.8"/>

<line x1="370" y1="16" x2="400" y2="16" stroke="#26684b" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="410" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Call</text>
<line x1="480" y1="16" x2="510" y2="16" stroke="#26684b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="520" y="20" fill="#245b41" font-size="9" font-family="'Geist Mono', monospace">Return</text>
</g>

      </svg>
    </div>
  </div>
</body>
</html>
