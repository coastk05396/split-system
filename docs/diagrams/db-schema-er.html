  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --accent: #bf4520;
      --font-sans: 'Geist', 'Noto Sans TC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 3rem 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .frame { width: 100%; max-width: 1200px; margin: 0 auto; }
    .eyebrow {
      margin-bottom: .5rem;
      color: var(--muted);
      font: 500 .66rem var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: .5rem;
      font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--font-serif);
      letter-spacing: -.02em;
    }
    .dek { margin-bottom: 1.5rem; color: var(--muted); font-size: .9rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
