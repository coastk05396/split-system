name: Sync flights

# 23:00 UTC = 07:00 Taipei, ahead of the "updated 08:00" promise; the Worker cron at 00:00 UTC is the fallback.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run uploads the SQL as an artifact; write updates production D1"
        type: choice
        options: [dry-run, write]
        default: dry-run

concurrency:
  group: sync-flights
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 23:00 UTC + 40 min ends before the Worker's 00:00 UTC fallback cron (ADR 0012).
    timeout-minutes: 40
    environment: production
    env:
      # Scheduled runs write; manual runs default to dry-run.
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'write' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/scripts/google-live-price/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r apps/worker/scripts/google-live-price/requirements.txt
      - name: Dry run (SQL artifact)
        if: env.MODE == 'dry-run'
        run: pnpm --filter @split/worker sync-flights -- --verify=google --profile=actions --dry-run --sql-file="$RUNNER_TEMP/sync.sql"
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      - name: Upload SQL
        if: env.MODE == 'dry-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-flights-sql
          path: ${{ runner.temp }}/sync.sql
          retention-days: 7
      # Runs `wrangler d1 execute DB --remote --env production --file <sql>` (see the script).
      - name: Write production D1
        if: env.MODE == 'write'
        run: pnpm --filter @split/worker sync-flights -- --verify=google --profile=actions --remote --env production
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
