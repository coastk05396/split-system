name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - name: Preflight duplicate identities before migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          result=$(pnpm exec wrangler d1 execute DB --remote --env production --json --command "SELECT COUNT(*) AS duplicate_groups FROM (SELECT 1 FROM identities GROUP BY user_id, provider HAVING COUNT(*) > 1)")
          node -e '
            let payload;
            try {
              payload = JSON.parse(process.argv[1] ?? "");
            } catch {
              console.error("Preflight failed: invalid JSON output from wrangler d1 execute.");
              process.exit(1);
            }
            if (!Array.isArray(payload) || payload.length !== 1) {
              console.error("Preflight failed: expected a single D1 statement envelope.");
              process.exit(1);
            }
            const statement = payload[0];
            if (
              statement === null ||
              typeof statement !== "object" ||
              statement.success !== true ||
              !Array.isArray(statement.results) ||
              statement.results.length !== 1
            ) {
              console.error("Preflight failed: expected one successful D1 result row.");
              process.exit(1);
            }
            const row = statement.results[0];
            if (
              row === null ||
              typeof row !== "object" ||
              typeof row.duplicate_groups !== "number" ||
              !Number.isInteger(row.duplicate_groups) ||
              row.duplicate_groups < 0
            ) {
              console.error("Preflight failed: expected a nonnegative integer duplicate_groups count.");
              process.exit(1);
            }
            if (row.duplicate_groups > 0) {
              console.error("Preflight failed: found " + row.duplicate_groups + " duplicate (user_id, provider) group(s) in identities. Reconcile sign-in methods manually before applying migration 0021.");
              process.exit(1);
            }
          ' "$result"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: d1 migrations apply DB --remote --env production
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --env production
